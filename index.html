<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel Inspector｜圖片像素與 LSB 分析工具</title>
<style>
  :root{
    --bg:#f7f1e8;
    --panel:#fffaf4;
    --panel2:#f1e4d5;
    --line:#d8c4ae;
    --text:#4a3a2d;
    --muted:#8b7764;
    --accent:#a97c50;
    --accent2:#d6b38e;
    --shadow:0 10px 30px rgba(80,55,35,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(135deg,#f9f5ef,#efe3d6);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:28px}
  .hero{
    display:flex;justify-content:space-between;align-items:end;gap:18px;
    margin-bottom:18px;
  }
  h1{margin:0;font-size:30px;letter-spacing:.5px}
  .sub{color:var(--muted);margin-top:6px;font-size:14px}
  .badge{
    background:#ead8c5;color:#76583b;border:1px solid #d9bea2;
    border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap;
  }

  .toolbar{
    background:rgba(255,250,244,.9);
    backdrop-filter:blur(8px);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:18px;
    padding:14px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin-bottom:16px;
  }
  .btn, .file-label{
    border:none;border-radius:12px;padding:10px 14px;
    background:var(--accent);color:white;font-weight:700;
    cursor:pointer;transition:.2s;text-decoration:none;font-size:14px;
  }
  .btn:hover,.file-label:hover{transform:translateY(-1px);filter:brightness(.98)}
  .btn.secondary{background:#e8d5c1;color:#634b35}
  input[type=file]{display:none}
  .zoomText{margin-left:auto;color:var(--muted);font-size:14px}

  .grid{
    display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);
    box-shadow:var(--shadow);border-radius:18px;overflow:hidden;
  }
  .canvas-wrap{
    min-height:600px;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
    background:
      linear-gradient(45deg,#f4eadf 25%,transparent 25%),
      linear-gradient(-45deg,#f4eadf 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#f4eadf 75%),
      linear-gradient(-45deg,transparent 75%,#f4eadf 75%);
    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0;
    position:relative;
    overflow:auto;
  }
  #canvas{
    max-width:none;
    image-rendering:auto;
    cursor:crosshair;
    box-shadow:0 8px 24px rgba(50,35,25,.15);
    background:white;
  }
  .empty{
    position:absolute;text-align:center;color:var(--muted);
    pointer-events:none;padding:20px;
  }
  .empty strong{display:block;color:#71583f;font-size:18px;margin-bottom:5px}
  .side{padding:16px}
  .section-title{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:800;margin-bottom:10px}
  .info{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;
  }
  .metric{
    background:var(--panel2);border:1px solid #dfc9b3;border-radius:14px;padding:12px;
  }
  .metric span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .metric b{font-size:18px}
  .colorBox{
    display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);
    padding:12px;border-radius:14px;margin-bottom:16px;
  }
  #swatch{width:44px;height:44px;border-radius:10px;border:1px solid #bbb;background:#fff}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  table{width:100%;border-collapse:separate;border-spacing:0 8px}
  td{background:#f7ede2;padding:10px;font-size:13px}
  td:first-child{border-radius:10px 0 0 10px;font-weight:800}
  td:last-child{border-radius:0 10px 10px 0;text-align:right}
  .magnifier-box{
    border:1px solid var(--line);border-radius:14px;background:white;
    padding:10px;margin-top:14px;
  }
  #mag{
    width:100%;height:220px;border-radius:10px;border:1px solid #dac8b7;
    image-rendering:pixelated;background:#fff;
  }
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .status{
    margin-top:16px;padding:12px 14px;border-radius:14px;
    border:1px dashed #cfb69d;color:#7a644f;background:#f8efe5;font-size:13px;
  }
  @media(max-width:900px){
    .grid{grid-template-columns:1fr}
    .canvas-wrap{min-height:420px}
    .zoomText{width:100%;margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>Pixel Inspector</h1>
      <div class="sub">圖片像素值、RGB、HEX、二進位與 LSB 即時分析</div>
    </div>
    <div class="badge">前端單檔版・免安裝</div>
  </div>

  <div class="toolbar">
    <label class="file-label" for="fileInput">📁 上傳圖片</label>
    <input id="fileInput" type="file" accept="image/*" />
    <button class="btn secondary" id="zoomIn">＋ 放大</button>
    <button class="btn secondary" id="zoomOut">－ 縮小</button>
    <button class="btn secondary" id="resetZoom">↺ 原始大小</button>
    <button class="btn secondary" id="fit">⤢ 適應畫面</button>
    <span class="zoomText">縮放：<b id="zoomLabel">100%</b></span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div class="empty" id="emptyState">
          <strong>請先上傳一張圖片</strong>
          滑鼠移到圖片上，就會即時顯示該位置的像素資訊
        </div>
      </div>
    </div>

    <div class="card side">
      <div class="section-title">PIXEL INFO</div>
      <div class="info">
        <div class="metric"><span>X 座標</span><b id="xVal">—</b></div>
        <div class="metric"><span>Y 座標</span><b id="yVal">—</b></div>
      </div>

      <div class="colorBox">
        <div id="swatch"></div>
        <div>
          <div class="mono" id="rgbText">RGB(—, —, —)</div>
          <div class="mono" id="hexText">#------</div>
        </div>
      </div>

      <div class="section-title">RGB / BINARY / LSB</div>
      <table>
        <tr><td>R</td><td class="mono" id="rBin">--------</td><td id="rLsb">—</td></tr>
        <tr><td>G</td><td class="mono" id="gBin">--------</td><td id="gLsb">—</td></tr>
        <tr><td>B</td><td class="mono" id="bBin">--------</td><td id="bLsb">—</td></tr>
        <tr><td>A</td><td class="mono" id="aVal">—</td><td>Alpha</td></tr>
      </table>

      <div class="magnifier-box">
        <div class="section-title">PIXEL MAGNIFIER</div>
        <canvas id="mag" width="220" height="220"></canvas>
        <div class="hint">中央方框代表目前滑鼠指到的像素；周圍區域會用像素化方式放大。</div>
      </div>

      <div class="status" id="status">尚未載入圖片。</div>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {willReadFrequently:true});
const wrap = document.getElementById('canvasWrap');
const empty = document.getElementById('emptyState');
const mag = document.getElementById('mag');
const mctx = mag.getContext('2d');
mctx.imageSmoothingEnabled = false;

let img = new Image();
let zoom = 1;
let loaded = false;

const $ = id => document.getElementById(id);
const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

function drawImage(){
  if(!loaded) return;
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0);
  canvas.style.width = (img.naturalWidth * zoom) + 'px';
  canvas.style.height = (img.naturalHeight * zoom) + 'px';
  $('zoomLabel').textContent = Math.round(zoom*100) + '%';
}

fileInput.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  img = new Image();
  img.onload = ()=>{
    loaded = true;
    zoom = 1;
    drawImage();
    empty.style.display='none';
    $('status').textContent = `已載入：${file.name}｜${img.naturalWidth} × ${img.naturalHeight} px`;
    URL.revokeObjectURL(url);
  };
  img.src = url;
});

canvas.addEventListener('mousemove', e=>{
  if(!loaded) return;

  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) * canvas.width / rect.width);
  const y = Math.floor((e.clientY - rect.top) * canvas.height / rect.height);
  if(x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

  const p = ctx.getImageData(x,y,1,1).data;
  const [r,g,b,a] = p;

  $('xVal').textContent = x;
  $('yVal').textContent = y;
  $('rgbText').textContent = `RGB(${r}, ${g}, ${b})`;

  const hex = '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
  $('hexText').textContent = hex;
  $('swatch').style.background = `rgba(${r},${g},${b},${a/255})`;

  const rb = r.toString(2).padStart(8,'0');
  const gb = g.toString(2).padStart(8,'0');
  const bb = b.toString(2).padStart(8,'0');

  $('rBin').textContent = rb;
  $('gBin').textContent = gb;
  $('bBin').textContent = bb;
  $('rLsb').textContent = rb.at(-1);
  $('gLsb').textContent = gb.at(-1);
  $('bLsb').textContent = bb.at(-1);
  $('aVal').textContent = a;

  drawMagnifier(x,y);
});

function drawMagnifier(x,y){
  const sample = 11;
  const half = Math.floor(sample/2);
  const sx = clamp(x-half, 0, Math.max(0,canvas.width-sample));
  const sy = clamp(y-half, 0, Math.max(0,canvas.height-sample));

  mctx.clearRect(0,0,mag.width,mag.height);
  mctx.imageSmoothingEnabled = false;
  mctx.drawImage(canvas, sx, sy, sample, sample, 0, 0, mag.width, mag.height);

  const cellW = mag.width/sample;
  const cellH = mag.height/sample;
  mctx.lineWidth = 1;
  mctx.strokeStyle = 'rgba(80,60,40,.25)';
  for(let i=1;i<sample;i++){
    mctx.beginPath(); mctx.moveTo(i*cellW,0); mctx.lineTo(i*cellW,mag.height); mctx.stroke();
    mctx.beginPath(); mctx.moveTo(0,i*cellH); mctx.lineTo(mag.width,i*cellH); mctx.stroke();
  }

  const centerX = half*cellW;
  const centerY = half*cellH;
  mctx.lineWidth = 3;
  mctx.strokeStyle = '#7b4f2d';
  mctx.strokeRect(centerX+1.5, centerY+1.5, cellW-3, cellH-3);
}

$('zoomIn').addEventListener('click',()=>{ if(!loaded)return; zoom=Math.min(5,zoom*1.25); drawImage(); });
$('zoomOut').addEventListener('click',()=>{ if(!loaded)return; zoom=Math.max(.1,zoom/1.25); drawImage(); });
$('resetZoom').addEventListener('click',()=>{ if(!loaded)return; zoom=1; drawImage(); });
$('fit').addEventListener('click',()=>{
  if(!loaded) return;
  const usableW = Math.max(200, wrap.clientWidth - 36);
  const usableH = 560;
  zoom = Math.min(1, usableW/img.naturalWidth, usableH/img.naturalHeight);
  drawImage();
});
</script>
</body>
</html>
